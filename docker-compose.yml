# 笔记网站部署编排：后端 API + Caddy（静态前端 + /api 反代）
# 用法见 docs/deploy.md
services:
  api:
    build:
      context: ./apps/api
    container_name: notes-api
    restart: unless-stopped
    # 与 open-webui 一致：让容器能访问宿主机上的 Hermes（:8642）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # SQLite 文件放挂载卷（绝对路径 /data/notes.db）
      DATABASE_URL: sqlite:////data/notes.db
      # SECRET_KEY 必填：未在 .env 设置时 compose 会直接报错（防用默认弱密钥）
      SECRET_KEY: ${SECRET_KEY:?请在根目录 .env 设置 SECRET_KEY（用 openssl rand -hex 32 生成）}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      # —— 发布到 Wiki（可选；不填 WIKI_OWNER 则功能关闭，端点返回 503）——
      WIKI_ENTRIES_PATH: /wiki/entries
      WIKI_OWNER: ${WIKI_OWNER:-}
      WIKI_UID: ${WIKI_UID:-0}
      WIKI_GID: ${WIKI_GID:-0}
      # —— 网页总结（agent 抓取+总结；不填则功能关闭，端点返回 503）——
      # 直连 Hermes（与 open-webui 同一后端）；模型需支持 function-calling
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      # 数据库持久化卷（删/重建容器数据不丢）
      - notes-data:/data
      # Hermes llm-wiki 的来源目录（宿主机 ↔ 容器；见 ADR-001）
      - /home/ubuntu/wiki/entries:/wiki/entries
    # 健康检查：探测 /api/health，失败则标记 unhealthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # 资源限制：防单服务内存泄漏拖垮宿主机
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    # 日志上限：防 docker 日志写满磁盘
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 安全加固：禁止提权
    security_opt:
      - no-new-privileges:true

  open-webui:
    image: ghcr.nju.edu.cn/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8642/v1
      OPENAI_API_KEY: ${HERMES_API_KEY:?请在 .env 设置 HERMES_API_KEY}
      ENABLE_SIGNUP: "true"
      WEBUI_AUTH: "true"
      DEFAULT_LOCALE: "zh-CN"
    volumes:
      - open-webui-data:/app/backend/data
    # 健康检查：探测 open-webui 内置 /health 端点
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: notes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # 等待后端健康后才启动转发，避免启动期间 502
    depends_on:
      api:
        condition: service_healthy
      open-webui:
        condition: service_healthy
    # 持久化 Caddy 的证书与 ACME 状态，容器重建也不丢（防止证书再次丢失）
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/certs:/certs:ro
    # 健康检查：探测前端首页是否可访问
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true

volumes:
  notes-data:
  open-webui-data:
  caddy_data:
  caddy_config:
