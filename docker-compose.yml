# 笔记网站部署编排：后端 API + Caddy（静态前端 + /api 反代）
# 用法见 docs/deploy.md
services:
  db:
    image: postgres:16-alpine
    container_name: notes-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: notes
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 设置 POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d notes"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./apps/api
    container_name: notes-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # PostgreSQL 连接串（指向同网络的 db 服务）
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/notes
      # SECRET_KEY 必填：未在 .env 设置时 compose 会直接报错（防用默认弱密钥）
      SECRET_KEY: ${SECRET_KEY:?请在根目录 .env 设置 SECRET_KEY（用 openssl rand -hex 32 生成）}
      ACCESS_TOKEN_EXPIRE_MINUTES: "30"
      REFRESH_TOKEN_EXPIRE_DAYS: "7"
      # —— 管理后台服务间鉴权密钥（Spring Boot 调 /api/admin/* 时携带）——
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      # —— 发布到 Wiki（可选；不填 WIKI_OWNER 则功能关闭，端点返回 503）——
      WIKI_ENTRIES_PATH: /wiki/entries
      WIKI_OWNER: ${WIKI_OWNER:-}
      WIKI_UID: ${WIKI_UID:-0}
      WIKI_GID: ${WIKI_GID:-0}
    volumes:
      # 数据库持久化卷（删/重建容器数据不丢）
      - notes-data:/data
      # Hermes llm-wiki 的来源目录（宿主机 ↔ 容器；见 ADR-001）
      - /home/ubuntu/wiki/entries:/wiki/entries

  open-webui:
    image: ghcr.nju.edu.cn/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_BASE_URL: http://host.docker.internal:8642/v1
      OPENAI_API_KEY: ${HERMES_API_KEY:?请在 .env 设置 HERMES_API_KEY}
      ENABLE_SIGNUP: "true"
      WEBUI_AUTH: "true"
      DEFAULT_LOCALE: "zh-CN"
    volumes:
      - open-webui-data:/app/backend/data

  caddy:
    build:
      context: .
      dockerfile: deploy/Dockerfile.caddy
    container_name: notes-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - api
      - open-webui
    # 持久化 Caddy 的证书与 ACME 状态，容器重建也不丢（防止证书再次丢失）
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./deploy/certs:/certs:ro

  mkdocs:
    image: squidfunk/mkdocs-material:latest
    container_name: notes-mkdocs
    restart: unless-stopped
    volumes:
      - /home/ubuntu/wiki/mkdocs.yml:/docs/mkdocs.yml:ro
      - /home/ubuntu/wiki:/content

volumes:
  pg-data:
  open-webui-data:
  caddy_data:
  caddy_config:
